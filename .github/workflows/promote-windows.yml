name: Promote Windows beta

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Windows beta candidate workflow run ID
        required: true
        type: string
      tag:
        description: Candidate tag used by that workflow run
        required: true
        type: string

concurrency:
  group: promote-windows-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Publish accepted candidate without rebuilding
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Resolve and authorize the candidate run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/release-windows.yml
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'candidate_run_id must contain only a non-zero decimal workflow run ID.' >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]] || {
            echo 'tag must be a semantic-version prerelease tag.' >&2
            exit 1
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]] || {
            echo 'Candidate workflow is not complete.' >&2
            exit 1
          }
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]] || {
            echo 'Candidate workflow did not complete successfully.' >&2
            exit 1
          }
          [[ "$(jq -r '.event' <<<"$run_json")" == 'workflow_dispatch' ]] || {
            echo 'Candidate was not produced by an explicitly dispatched workflow.' >&2
            exit 1
          }
          [[ "$(jq -r '.path' <<<"$run_json")" == "$EXPECTED_WORKFLOW_PATH" ]] || {
            echo 'Run ID does not identify the Windows beta candidate workflow.' >&2
            exit 1
          }
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == "$DEFAULT_BRANCH" ]] || {
            echo 'Candidate source is not the repository default branch.' >&2
            exit 1
          }
          [[ "$(jq -r '.repository.full_name' <<<"$run_json")" == "$GITHUB_REPOSITORY" ]] || {
            echo 'Candidate belongs to a different repository.' >&2
            exit 1
          }

          source_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Candidate source commit is malformed.' >&2
            exit 1
          }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=ludds-blessing-${RELEASE_TAG}-windows-x64" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate source metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/release/verify-release.ps1 -Tag $env:RELEASE_TAG
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "notes=docs/release-notes/$version-beta.md" >> $env:GITHUB_OUTPUT

      - name: Download the retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: artifacts
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify provenance, contents, and every checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          ./scripts/release/verify-windows-artifacts.ps1 `
            -ArtifactRoot artifacts `
            -Tag $env:RELEASE_TAG `
            -SourceCommit $env:SOURCE_COMMIT `
            -Repository $env:GITHUB_REPOSITORY `
            -WorkflowRunId $env:CANDIDATE_RUN_ID

      - name: Reject an existing tag at a different commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            [[ "$tag_commit" == "$SOURCE_COMMIT" ]] || {
              echo "Existing tag $RELEASE_TAG points to $tag_commit, not accepted candidate $SOURCE_COMMIT." >&2
              exit 1
            }
          fi

      - name: Reject an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set +e
          response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          api_status=$?
          set -e
          if [[ $api_status -eq 0 ]]; then
            echo "A GitHub release already exists for $RELEASE_TAG; refusing to add or replace assets." >&2
            exit 1
          fi
          grep -Eq '(HTTP[/0-9. ]+404|HTTP 404)' <<<"$response" || {
            echo 'Could not verify that the release tag is unused.' >&2
            echo "$response" >&2
            exit 1
          }

      - name: Create GitHub prerelease from the accepted artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.candidate.outputs.source_sha }}
          name: Ludd's Blessing ${{ inputs.tag }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ steps.metadata.outputs.notes }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/LuddsBlessing_*_windows-x64/*
            artifacts/*.zip
            artifacts/*-SHA256SUMS.txt
