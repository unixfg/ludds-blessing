name: Promote Windows beta

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Windows beta candidate workflow run ID
        required: true
        type: string
      tag:
        description: Beta tag used by that workflow run (for example vX.Y.Z-beta.1)
        required: true
        type: string

concurrency:
  group: windows-beta-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Publish accepted candidate without rebuilding
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Resolve and authorize the candidate run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/release-windows.yml
          PROMOTION_REF_NAME: ${{ github.ref_name }}
          PROMOTION_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [[ "$PROMOTION_REF_TYPE" == 'branch' && "$PROMOTION_REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "Promotion itself must be dispatched from the repository default branch, $DEFAULT_BRANCH." >&2
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'candidate_run_id must contain only a non-zero decimal workflow run ID.' >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]] || {
            echo 'tag must be a numbered beta tag such as vX.Y.Z-beta.1.' >&2
            exit 1
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]] || {
            echo 'Candidate workflow is not complete.' >&2
            exit 1
          }
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]] || {
            echo 'Candidate workflow did not complete successfully.' >&2
            exit 1
          }
          [[ "$(jq -r '.event' <<<"$run_json")" == 'workflow_dispatch' ]] || {
            echo 'Candidate was not produced by an explicitly dispatched workflow.' >&2
            exit 1
          }
          [[ "$(jq -r '.path' <<<"$run_json")" == "$EXPECTED_WORKFLOW_PATH" ]] || {
            echo 'Run ID does not identify the Windows beta candidate workflow.' >&2
            exit 1
          }
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == "$DEFAULT_BRANCH" ]] || {
            echo 'Candidate source is not the repository default branch.' >&2
            exit 1
          }
          [[ "$(jq -r '.repository.full_name' <<<"$run_json")" == "$GITHUB_REPOSITORY" ]] || {
            echo 'Candidate belongs to a different repository.' >&2
            exit 1
          }

          source_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Candidate source commit is malformed.' >&2
            exit 1
          }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=ludds-blessing-${RELEASE_TAG}-windows-x64" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate source metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/release/verify-release.ps1 -Tag $env:RELEASE_TAG
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "notes=docs/release-notes/$version-beta.md" >> $env:GITHUB_OUTPUT

      - name: Download the retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: artifacts
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify provenance, contents, and every checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          ./scripts/release/verify-windows-artifacts.ps1 `
            -ArtifactRoot artifacts `
            -Tag $env:RELEASE_TAG `
            -SourceCommit $env:SOURCE_COMMIT `
            -Repository $env:GITHUB_REPOSITORY `
            -WorkflowRunId $env:CANDIDATE_RUN_ID

      - name: Revalidate the source branch and any existing tag
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "The accepted candidate is no longer on $DEFAULT_BRANCH." >&2
            exit 1
          }

          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
            [[ "$tag_commit" == "$SOURCE_COMMIT" ]] || {
              echo "Existing tag $RELEASE_TAG points to $tag_commit, not accepted candidate $SOURCE_COMMIT." >&2
              exit 1
            }
          fi

      - name: Resolve release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t staging_directories < <(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'LuddsBlessing_*_windows-x64')
          [[ ${#staging_directories[@]} -eq 1 ]] || {
            echo 'The verified artifact must contain exactly one staging directory.' >&2
            exit 1
          }
          mapfile -t executables < <(find "${staging_directories[0]}" -maxdepth 1 -type f -name 'LuddsBlessing_*_windows-x64.exe')
          [[ ${#executables[@]} -eq 1 ]] || {
            echo 'The verified artifact must contain exactly one public Windows executable.' >&2
            exit 1
          }
          echo "executable=${executables[0]}" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set +e
          response="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          api_status=$?
          set -e
          if [[ $api_status -eq 0 ]]; then
            if jq -e '.draft == true' <<<"$response" >/dev/null; then
              echo "Reusing the existing unpublished draft for $RELEASE_TAG."
              exit 0
            fi
            echo "A published GitHub release already exists for $RELEASE_TAG; refusing to alter it." >&2
            exit 1
          fi
          grep -Eq '(HTTP[/0-9. ]+404|HTTP 404)' <<<"$response" || {
            echo 'Could not verify that the release tag is unused.' >&2
            echo "$response" >&2
            exit 1
          }

      - name: Create or repair the unpublished draft and upload the executable
        id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.candidate.outputs.source_sha }}
          name: Ludd's Blessing ${{ inputs.tag }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ steps.metadata.outputs.notes }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ steps.assets.outputs.executable }}

      - name: Verify the draft executable, then publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLIC_EXECUTABLE: ${{ steps.assets.outputs.executable }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'The release action did not return a valid draft release ID.' >&2
            exit 1
          }

          expected_assets="$(mktemp)"
          actual_assets="$(mktemp)"
          [[ -f "$PUBLIC_EXECUTABLE" ]] || {
            echo 'The selected public executable is missing.' >&2
            exit 1
          }
          printf '%s\t%s\tsha256:%s\n' \
            "$(basename "$PUBLIC_EXECUTABLE")" \
            "$(stat -c '%s' "$PUBLIC_EXECUTABLE")" \
            "$(sha256sum "$PUBLIC_EXECUTABLE" | awk '{print $1}')" > "$expected_assets"

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == true and .prerelease == true and .tag_name == $tag' \
            <<<"$release_json" >/dev/null || {
              echo 'The uploaded release is not the expected unpublished prerelease.' >&2
              exit 1
            }
          jq -r '.assets[] | [.name, (.size | tostring), .digest] | @tsv' \
            <<<"$release_json" | sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

          published="$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false)"
          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == false and .prerelease == true and .tag_name == $tag' \
            <<<"$published" >/dev/null
          echo "Published $(jq -r '.html_url' <<<"$published")"
