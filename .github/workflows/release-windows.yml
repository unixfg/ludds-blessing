name: Windows beta release
run-name: Windows beta ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

on:
  push:
    tags:
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate tag matching the package version (for example vX.Y.Z-beta.1)
        required: true
        type: string

concurrency:
  group: windows-beta-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 11.19.0
  NODE_VERSION: 24.19.0
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build unsigned Windows x64 candidate
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag and source commit
        id: release
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = '^v' + [regex]::Escape([string]$version) + '-beta\.[1-9][0-9]*$'
          if ($env:RELEASE_TAG -notmatch $expectedTag) {
            throw "Windows beta releases require a v$version-beta.N tag with a positive release number."
          }

          $sourceCommit = [string](& git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $sourceCommit.Trim() -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the checked-out source commit.'
          }
          $sourceCommit = $sourceCommit.Trim().ToLowerInvariant()

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:SOURCE_REF_TYPE -ne 'branch' -or $env:SOURCE_REF_NAME -ne $env:DEFAULT_BRANCH) {
              throw "Manual release candidates must be built from '$env:DEFAULT_BRANCH'."
            }
          } elseif ($env:EVENT_NAME -eq 'push') {
            if ($env:SOURCE_REF_TYPE -ne 'tag' -or $env:SOURCE_REF_NAME -ne $env:RELEASE_TAG) {
              throw 'Automatic Windows releases must be triggered by the validated tag.'
            }

            $tagCommit = [string](& git rev-list -n 1 "refs/tags/$env:RELEASE_TAG")
            if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim().ToLowerInvariant() -ne $sourceCommit) {
              throw "Tag $env:RELEASE_TAG does not resolve to the checked-out source commit."
            }

            $defaultBranchRefspec = "refs/heads/$($env:DEFAULT_BRANCH):refs/remotes/origin/$($env:DEFAULT_BRANCH)"
            & git fetch --no-tags origin $defaultBranchRefspec
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch the repository default branch '$env:DEFAULT_BRANCH'."
            }
            & git merge-base --is-ancestor $sourceCommit "refs/remotes/origin/$($env:DEFAULT_BRANCH)"
            if ($LASTEXITCODE -ne 0) {
              throw "Tag $env:RELEASE_TAG must identify a commit on '$env:DEFAULT_BRANCH'."
            }
          } else {
            throw "Unsupported release event: $env:EVENT_NAME"
          }

          "artifact_name=ludds-blessing-$env:RELEASE_TAG-windows-x64" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceCommit" >> $env:GITHUB_OUTPUT
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch the complete locked Rust graph for offline notices
        run: cargo fetch --locked
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify release metadata and repository hygiene
        shell: pwsh
        run: ./scripts/release/verify-release.ps1 -Tag $env:RELEASE_TAG
      - name: Audit the production npm graph
        run: pnpm audit --prod --audit-level high
      - name: Install the reviewed cargo-audit release
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the locked Rust graph
        run: cargo audit
      - name: Test frontend
        run: pnpm test
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --locked
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build unsigned offline NSIS installer and portable executable
        run: pnpm tauri build --bundles nsis

      - name: Require tests and builds to leave the source tree clean
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not verify the post-build repository state.'
          }
          if ($dirty.Count -ne 0) {
            $dirty | ForEach-Object { Write-Error $_ }
            throw 'Release tests or builds changed tracked source or created an unexpected file.'
          }

      - name: Stage binaries and dependency notices
        id: stage
        shell: pwsh
        run: |
          $null = ./scripts/release/prepare-windows.ps1 -OutputRoot artifacts
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "directory=artifacts/LuddsBlessing_${version}_windows-x64" >> $env:GITHUB_OUTPUT
          "root=artifacts" >> $env:GITHUB_OUTPUT

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          # Scan the checked-out locked source graph as well as the staged
          # binaries; statically linked Rust dependencies are not all
          # recoverable from an unauditable executable alone.
          path: .
          format: spdx-json
          output-file: ${{ steps.stage.outputs.directory }}/SBOM.spdx.json
          upload-artifact: false

      - name: Bind provenance to this candidate run
        shell: pwsh
        run: |
          ./scripts/release/new-release-provenance.ps1 `
            -StagingDirectory '${{ steps.stage.outputs.directory }}' `
            -Tag $env:RELEASE_TAG `
            -SourceCommit '${{ steps.release.outputs.source_sha }}' `
            -Repository $env:GITHUB_REPOSITORY `
            -WorkflowRunId $env:GITHUB_RUN_ID

      - name: Finalize archive and SHA-256 manifests
        shell: pwsh
        run: ./scripts/release/finalize-windows.ps1 -StagingDirectory '${{ steps.stage.outputs.directory }}'

      - name: Verify the complete candidate artifact
        shell: pwsh
        run: |
          ./scripts/release/verify-windows-artifacts.ps1 `
            -ArtifactRoot '${{ steps.stage.outputs.root }}' `
            -Tag $env:RELEASE_TAG `
            -SourceCommit '${{ steps.release.outputs.source_sha }}' `
            -Repository $env:GITHUB_REPOSITORY `
            -WorkflowRunId $env:GITHUB_RUN_ID

      - name: Upload immutable review candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 35

      - name: Record release status
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            $nextStep = 'Publication is waiting for approval in the protected release environment.'
          } else {
            $nextStep = 'This manual run only built a candidate. Supply this run ID and tag to the Promote Windows beta workflow after acceptance.'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Candidate ready for review

          - Tag: ``$env:RELEASE_TAG``
          - Source: ``${{ steps.release.outputs.source_sha }}``
          - Workflow run ID: ``$env:GITHUB_RUN_ID``
          - Actions artifact digest: ``${{ steps.upload.outputs.artifact-digest }}``

          $nextStep
          "@

  verify:
    name: Independently verify the retained candidate
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate the immutable tag and source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REF: refs/tags/${{ needs.build.outputs.tag }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "$EXPECTED_REF" ]] || {
            echo "Workflow ref $GITHUB_REF does not match $EXPECTED_REF." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || {
            echo 'Checked-out source does not match the accepted candidate.' >&2
            exit 1
          }

          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" == "$SOURCE_COMMIT" ]] || {
            echo "Tag $RELEASE_TAG no longer identifies the accepted source commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "Tag $RELEASE_TAG does not identify a commit on $DEFAULT_BRANCH." >&2
            exit 1
          }

      - name: Verify candidate source metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: ./scripts/release/verify-release.ps1 -Tag $env:RELEASE_TAG

      - name: Download the accepted candidate from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true

      - name: Verify provenance, contents, and every checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_sha }}
        run: |
          ./scripts/release/verify-windows-artifacts.ps1 `
            -ArtifactRoot artifacts `
            -Tag $env:RELEASE_TAG `
            -SourceCommit $env:SOURCE_COMMIT `
            -Repository $env:GITHUB_REPOSITORY `
            -WorkflowRunId $env:GITHUB_RUN_ID

  publish:
    name: Publish approved Windows prerelease
    if: ${{ github.event_name == 'push' }}
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate the immutable tag immediately before publication
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REF: refs/tags/${{ needs.build.outputs.tag }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "$EXPECTED_REF" ]] || {
            echo "Workflow ref $GITHUB_REF does not match $EXPECTED_REF." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || {
            echo 'Checked-out source does not match the accepted candidate.' >&2
            exit 1
          }

          git fetch --force origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" == "$SOURCE_COMMIT" ]] || {
            echo "Tag $RELEASE_TAG no longer identifies the accepted source commit." >&2
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_COMMIT" "refs/remotes/origin/$DEFAULT_BRANCH" || {
            echo "Tag $RELEASE_TAG does not identify a commit on $DEFAULT_BRANCH." >&2
            exit 1
          }

      - name: Download the exact verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true

      - name: Resolve release assets and notes
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t staging_directories < <(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'LuddsBlessing_*_windows-x64')
          [[ ${#staging_directories[@]} -eq 1 ]] || {
            echo 'The verified artifact must contain exactly one staging directory.' >&2
            exit 1
          }
          notes="${staging_directories[0]}/RELEASE_NOTES.md"
          [[ -f "$notes" ]] || {
            echo 'The verified artifact does not contain release notes.' >&2
            exit 1
          }
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set +e
          response="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          api_status=$?
          set -e
          if [[ $api_status -eq 0 ]]; then
            if jq -e '.draft == true' <<<"$response" >/dev/null; then
              echo "Reusing the existing unpublished draft for $RELEASE_TAG."
              exit 0
            fi
            echo "A published GitHub release already exists for $RELEASE_TAG; refusing to alter it." >&2
            exit 1
          fi
          grep -Eq '(HTTP[/0-9. ]+404|HTTP 404)' <<<"$response" || {
            echo 'Could not verify that the release tag is unused.' >&2
            echo "$response" >&2
            exit 1
          }

      - name: Create or repair the unpublished draft and upload every asset
        id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.source_sha }}
          name: Ludd's Blessing ${{ needs.build.outputs.tag }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ steps.assets.outputs.notes }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/LuddsBlessing_*_windows-x64/*
            artifacts/*.zip
            artifacts/*-SHA256SUMS.txt

      - name: Verify every draft asset, then publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'The release action did not return a valid draft release ID.' >&2
            exit 1
          }

          expected_assets="$(mktemp)"
          actual_assets="$(mktemp)"
          find artifacts/LuddsBlessing_*_windows-x64 -maxdepth 1 -type f -print0 \
            | while IFS= read -r -d '' asset; do
                printf '%s\t%s\n' "$(basename "$asset")" "$(stat -c '%s' "$asset")"
              done > "$expected_assets"
          find artifacts -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*-SHA256SUMS.txt' \) -print0 \
            | while IFS= read -r -d '' asset; do
                printf '%s\t%s\n' "$(basename "$asset")" "$(stat -c '%s' "$asset")"
              done >> "$expected_assets"
          sort -o "$expected_assets" "$expected_assets"
          [[ -z "$(cut -f1 "$expected_assets" | uniq -d)" ]] || {
            echo 'Release asset names must be unique.' >&2
            exit 1
          }

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == true and .prerelease == true and .tag_name == $tag' \
            <<<"$release_json" >/dev/null || {
              echo 'The uploaded release is not the expected unpublished prerelease.' >&2
              exit 1
            }
          jq -r '.assets[] | [.name, (.size | tostring)] | @tsv' \
            <<<"$release_json" | sort > "$actual_assets"
          diff -u "$expected_assets" "$actual_assets"

          published="$(gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false)"
          jq -e --arg tag "$RELEASE_TAG" \
            '.draft == false and .prerelease == true and .tag_name == $tag' \
            <<<"$published" >/dev/null
          echo "Published $(jq -r '.html_url' <<<"$published")"
