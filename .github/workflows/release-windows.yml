name: Windows release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 11.19.0
  NODE_VERSION: 24.19.0

jobs:
  release:
    name: Build and publish Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the version tag
        id: version
        shell: pwsh
        run: |
          $version = [string](Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Windows releases require the exact package version tag $expectedTag."
          }

          $notes = "docs/release-notes/$version.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }

          "number=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows executable
        run: pnpm tauri build --no-bundle

      - name: Name the release executable
        id: executable
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $repoRoot = [string]$env:GITHUB_WORKSPACE
          $candidates = @(
            (Join-Path $repoRoot 'target\release\ludds-blessing.exe'),
            (Join-Path $repoRoot 'src-tauri\target\release\ludds-blessing.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          $candidates = @($candidates)

          if ($candidates.Count -ne 1) {
            throw "Expected exactly one built ludds-blessing.exe, found $($candidates.Count)."
          }

          $outputDirectory = Join-Path $repoRoot 'release'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $destination = Join-Path $outputDirectory "LuddsBlessing_$($env:VERSION)_windows-x64.exe"
          Copy-Item -LiteralPath $candidates[0] -Destination $destination
          "path=$destination" >> $env:GITHUB_OUTPUT

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
          RELEASE_EXECUTABLE: ${{ steps.executable.outputs.path }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_EXECUTABLE `
            --verify-tag `
            --title $env:GITHUB_REF_NAME `
            --notes-file $env:RELEASE_NOTES `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publication failed.'
          }
