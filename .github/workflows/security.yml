name: Dependency security

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - .github/dependabot.yml
      - .github/workflows/security.yml
  push:
    branches: [main, master]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - .github/dependabot.yml
      - .github/workflows/security.yml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.19.0
  NODE_VERSION: 24.19.0

jobs:
  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-audit
      - name: Install the reviewed cargo-audit release
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the locked Rust graph
        # Vulnerabilities fail cargo-audit by default. Informational advisories
        # remain visible without making Windows releases depend on Linux-only
        # GTK3 maintenance warnings in Tauri's cross-platform lock graph.
        run: cargo audit

  npm-audit:
    name: Production npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Audit the locked production graph
        run: pnpm audit --prod --audit-level high

  dependency-review:
    name: Pull-request dependency review
    if: ${{ github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
