name: Feature request
description: Suggest a focused improvement to the editor.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Do not attach real saves or Starsector/mod assets. Describe examples with synthetic data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is difficult or unavailable today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired outcome and any save-integrity constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
